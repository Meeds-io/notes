AiAgentChat.uxBindings.Note-Summary.name=Write the summary from the note
AiAgentChat.uxBindings.Note-Summary.promptTemplate=Write the summary of this note for its Properties: {content_body}
AiAgentChat.uxBindings.Note-Summary.outputPromptTemplate=# Expected Output:\n\nThe note is in the message above, as it is on the user's screen: do not read it with a tool.\n\nWrite the note's summary for its Properties, as plain text: 2 to 4 sentences, at most 600 characters, in the language the note is written in. No title, no list, no markdown, no quotation marks around it, and nothing the note does not say. Answer with the summary only.
AiAgentChat.uxBindings.Note-Illustration.name=Illustrate this note
AiAgentChat.uxBindings.Note-Illustration.promptTemplate=Create a featured image for this note, without any text in the image: {content_body}
AiAgentChat.uxBindings.Note-Illustration.outputPromptTemplate=# Expected Output:\n\nOne image that illustrates the note above, for the banner shown at the top of the note: a wide landscape composition whose subject stays visible when the image is cropped to a thin horizontal band. No text, letters, numbers, logos or watermark anywhere in the image.
